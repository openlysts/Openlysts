        - generic [ref=f7e41]: The Discovery Engine
        - generic [ref=f7e44]:
          - img "Openlysts" [ref=f7e46]
          - heading "About Openlysts" [level=1] [ref=f7e47]
        - generic [ref=f7e48]:
          - paragraph [ref=f7e49]: Openlysts is a discovery engine for open-source software. It continuously scans GitHub, surfacing everything on Git — from high-quality curated repositories to vast unmapped projects — verifying licenses when applicable, and organizing them into intuitive categories so you can find the right project in seconds instead of scrolling endlessly through search results.
          - paragraph [ref=f7e50]: Built for developers, technical leads, and open-source enthusiasts, Openlysts helps you cut through the noise of GitHub's massive catalog. Whether you are looking for a local LLM to run privately, a self-hosted alternative to a SaaS tool, a developer productivity booster, or a framework for your next project, Openlysts surfaces repositories that are actively maintained and genuinely useful.
          - paragraph [ref=f7e51]: The platform is built and maintained by the Openlysts team, with data ingested and refreshed from GitHub every few hours. Trending scores highlight projects gaining momentum right now, while quality scores factor in documentation, community engagement, and maintenance activity — so you can trust that what you find is worth your time.
      - generic [ref=f7e52]:
        - generic [ref=f7e58]:
          - heading "Search Less, Find More" [level=3] [ref=f7e59]
          - paragraph [ref=f7e60]: Stop scrolling through GitHub. Search and filter across curated, categorized repositories in seconds.
        - generic [ref=f7e66]:
