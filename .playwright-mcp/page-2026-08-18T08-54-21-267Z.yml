                  - text: .
                - paragraph [ref=f4e189]:
                  - text: To publish sessions, use
                  - link [ref=f4e190] [cursor=pointer]:
                    - /url: https://github.com/badlogic/pi-share-hf
                    - code [ref=f4e191]: "`badlogic/pi-share-hf`"
                  - text: . Read its README.md for setup instructions. All you need is a Hugging Face account, the Hugging Face CLI, and
                  - code [ref=f4e192]: "`pi-share-hf`"
                  - text: .
                - paragraph [ref=f4e193]:
                  - text: You can also watch
                  - link "this video" [ref=f4e194] [cursor=pointer]:
                    - /url: https://x.com/badlogicgames/status/2041151967695634619
                  - text: ", where I show how I publish my"
                  - code [ref=f4e195]: "`pi-mono`"
                  - text: sessions.
                - paragraph [ref=f4e196]:
                  - text: I regularly publish my own
