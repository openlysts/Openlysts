                - heading "Permissions & Containerization" [level=2] [ref=f4e128]
                - paragraph [ref=f4e129]: Pi does not include a built-in permission system for restricting filesystem, process, network, or credential access. By default, it runs with the permissions of the user and process that launched it.
                - paragraph [ref=f4e130]:
                  - text: If you need stronger boundaries, containerize or sandbox Pi. See
                  - link "packages/coding-agent/docs/containerization.md" [ref=f4e131] [cursor=pointer]:
                    - /url: packages/coding-agent/docs/containerization.md
                  - text: "for three patterns:"
                - list [ref=f4e132]:
                  - listitem [ref=f4e133]:
                    - strong [ref=f4e134]: Gondolin extension
                    - text: ": keep"
                    - code [ref=f4e135]: "`pi`"
                    - text: and provider auth on the host while routing built-in tools and
                    - code [ref=f4e136]: "`!`"
                    - text: commands into a local Linux micro-VM.
                  - listitem [ref=f4e137]:
                    - strong [ref=f4e138]: Plain Docker
                    - text: ": run the whole"
                    - code [ref=f4e139]: "`pi`"
                    - text: process in a local container for simple isolation.
                  - listitem [ref=f4e140]:
                    - strong [ref=f4e141]: OpenShell
                    - text: ": run the whole"
                    - code [ref=f4e142]: "`pi`"
                    - text: process in a policy-controlled sandbox.
                - heading "Contributing" [level=2] [ref=f4e143]
                - paragraph [ref=f4e144]:
                  - text: See
                  - link "CONTRIBUTING.md" [ref=f4e145] [cursor=pointer]:
                    - /url: CONTRIBUTING.md
                  - text: for contribution guidelines and
                  - link "AGENTS.md" [ref=f4e146] [cursor=pointer]:
                    - /url: AGENTS.md
                  - text: for project-specific rules (for both humans and agents). Longer term plans for Pi can also be found in
                  - link "RFCs" [ref=f4e147] [cursor=pointer]:
                    - /url: https://rfc.earendil.com/keyword/pi/
                  - text: .
                - heading "Development" [level=2] [ref=f4e148]
                - code [ref=f4e150]: "npm install --ignore-scripts # Install all dependencies without running lifecycle scripts npm run build # Refresh model data, then build all packages npm run build:offline # Rebuild using existing model data without network access npm run check # Lint, format, and type check ./test.sh # Run tests (skips LLM-dependent tests without API keys) ./pi-test.sh # Run pi from sources (can be run from any directory)"
                - heading "Building standalone binaries from release source" [level=2] [ref=f4e151]
                - paragraph [ref=f4e152]:
                  - text: GitHub releases include a versioned source archive covered by the release's
                  - code [ref=f4e153]: "`SHA256SUMS`"
                  - text: "file. Extract it and run the same build script used for the official standalone binaries:"
                - code [ref=f4e155]: "VERSION=\"<release-version>\" tar -xzf \"pi-${VERSION}-source.tar.gz\" cd \"pi-${VERSION}\" ./scripts/build-binaries.sh --offline-model-data --platform linux-x64 --out \"$PWD/out\""
                - paragraph [ref=f4e156]:
                  - text: The source archive includes the generated provider model data used for the release.
                  - code [ref=f4e157]: "`--offline-model-data`"
                  - text: builds with that snapshot instead of refreshing it from live provider catalogs. The script still installs dependencies, builds the monorepo, compiles the Bun executable, and stages its runtime assets. Package maintainers who provide dependencies separately can pass
                  - code [ref=f4e158]: "`--skip-install --skip-deps`"
                  - text: .
                - heading "Supply-chain hardening" [level=2] [ref=f4e159]
                - paragraph [ref=f4e160]: We treat npm dependency changes as reviewed code changes.
                - list [ref=f4e161]:
                  - listitem [ref=f4e162]: Direct external dependencies are pinned to exact versions. Internal workspace packages remain version-ranged.
                  - listitem [ref=f4e163]:
                    - code [ref=f4e164]: "`.npmrc`"
                    - text: sets
                    - code [ref=f4e165]: "`save-exact=true`"
                    - text: and
                    - code [ref=f4e166]: "`min-release-age=2`"
                    - text: to avoid same-day dependency releases during npm resolution.
                  - listitem [ref=f4e167]:
                    - code [ref=f4e168]: "`package-lock.json`"
                    - text: is the dependency ground truth. Pre-commit blocks accidental lockfile commits unless
                    - code [ref=f4e169]: "`PI_ALLOW_LOCKFILE_CHANGE=1`"
                    - text: is set.
                  - listitem [ref=f4e170]:
                    - code [ref=f4e171]: "`npm run check`"
                    - text: verifies pinned direct deps, native TypeScript import compatibility, and the generated coding-agent shrinkwrap.
                  - listitem [ref=f4e172]:
                    - text: The published CLI package includes
                    - code [ref=f4e173]: "`packages/coding-agent/npm-shrinkwrap.json`"
                    - text: ", generated from the root lockfile, to pin transitive deps for npm users."
                  - listitem [ref=f4e174]:
                    - text: Release smoke tests use
                    - code [ref=f4e175]: "`npm run release:local`"
                    - text: to build, pack, and create isolated npm and Bun installs outside the repo before tagging a release.
                  - listitem [ref=f4e176]:
                    - text: Local release installs, documented npm installs, and
                    - code [ref=f4e177]: "`pi update --self`"
                    - text: use
                    - code [ref=f4e178]: "`--ignore-scripts`"
                    - text: where supported.
                  - listitem [ref=f4e179]:
                    - text: CI installs with
                    - code [ref=f4e180]: "`npm ci --ignore-scripts`"
                    - text: ", and a scheduled GitHub workflow runs"
                    - code [ref=f4e181]: "`npm audit --omit=dev`"
                    - text: plus
                    - code [ref=f4e182]: "`npm audit signatures --omit=dev`"
                    - text: .
                  - listitem [ref=f4e183]: Shrinkwrap generation has an explicit allowlist for dependency lifecycle scripts; new lifecycle-script deps fail checks until reviewed.
                - heading "Share your OSS coding agent sessions" [level=2] [ref=f4e184]
                - paragraph [ref=f4e185]: If you use Pi or other coding agents for open source work, please share your sessions.
                - paragraph [ref=f4e186]: Public OSS session data helps improve coding agents with real-world tasks, tool use, failures, and fixes instead of toy benchmarks.
                - paragraph [ref=f4e187]:
                  - text: For the full explanation, see
