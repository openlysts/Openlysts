                  - heading "Reactive Resume" [level=1] [ref=f23e4763]
                  - paragraph [ref=f23e4764]: Reactive Resume is a free and open-source resume builder that simplifies the process of creating, updating, and sharing your resume.
                  - paragraph [ref=f23e4765]:
                    - link [ref=f23e4766] [cursor=pointer]:
