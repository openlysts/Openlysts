                - heading "Self-Hosting" [level=2] [ref=f23e4894]
                - paragraph [ref=f23e4895]: "Reactive Resume can be self-hosted using Docker. The stack includes:"
                - list [ref=f23e4896]:
                  - listitem [ref=f23e4897]:
                    - strong [ref=f23e4898]: PostgreSQL
                    - text: — Database for storing user data and resumes
                  - listitem [ref=f23e4899]:
                    - strong [ref=f23e4900]: SeaweedFS
                    - text: (optional) — S3-compatible storage for file uploads
                - blockquote [ref=f23e4901]:
                  - paragraph [ref=f23e4902]:
                    - strong [ref=f23e4903]: From v5.1.0 onwards
                    - text: — PDF generation now runs entirely client-side via
                    - code [ref=f23e4904]: "`@react-pdf/renderer`"
                    - text: . New deployments no longer require Browserless, Chromium, or any external print service as a dependency. The
                    - code [ref=f23e4905]: "`PRINTER_*`"
                    - text: and
                    - code [ref=f23e4906]: "`BROWSERLESS_*`"
                    - text: environment variables are no longer read and can be removed from your
                    - code [ref=f23e4907]: "`.env`"
                    - text: .
                - paragraph [ref=f23e4908]: "Pull the latest image from Docker Hub or GitHub Container Registry:"
                - code [ref=f23e4910]: "# Docker Hub docker pull amruthpillai/reactive-resume:latest # GitHub Container Registry docker pull ghcr.io/amruthpillai/reactive-resume:latest"
                - paragraph [ref=f23e4911]:
                  - text: See the
                  - link "self-hosting guide" [ref=f23e4912] [cursor=pointer]:
                    - /url: https://docs.rxresu.me/self-hosting/docker
                  - text: for complete instructions.
