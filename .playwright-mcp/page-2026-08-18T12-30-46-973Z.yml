                - separator [ref=f23e4778]
                - paragraph [ref=f23e4779]: Reactive Resume makes building resumes straightforward. Pick a template, fill in your details, and export to PDF—no account required for basic use. For those who want more control, the entire application can be self-hosted on your own infrastructure.
                - paragraph [ref=f23e4780]: Built with privacy as a core principle, Reactive Resume gives you complete ownership of your data. The codebase is fully open-source under the MIT license, with no tracking, no ads, and no hidden costs.
                - heading "Sponsors" [level=2] [ref=f23e4781]
                - paragraph [ref=f23e4782]: Reactive Resume stays free, open-source, and independent because companies choose to support the work behind it. Thank you to every sponsor who helps fund hosting, maintenance, and continued development for the community.
                - paragraph [ref=f23e4783]:
                  - link [ref=f23e4784] [cursor=pointer]:
