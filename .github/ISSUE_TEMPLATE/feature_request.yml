name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: "Is your feature request related to a problem? Describe it clearly."
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: "Describe the solution you'd like."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Any alternative solutions or features you've considered."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "How important is this feature to you?"
      options:
        - Critical (blocking my workflow)
        - High (would significantly improve experience)
        - Medium (nice to have)
        - Low (minor improvement)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: "Which part of the app does this relate to?"
      options:
        - Discovery/Search
        - Repository Details
        - User Profile/Bookmarks
        - Authentication
        - Admin Dashboard
        - Settings
        - Mobile/Responsive
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Wireframes
      description: "If applicable, add mockups or wireframes."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: "Any other context or screenshots about the feature request."
    validations:
      required: false
