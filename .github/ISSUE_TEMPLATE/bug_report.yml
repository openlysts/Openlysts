name: Bug Report
description: Report a bug in Openlysts
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: input
    id: url
    attributes:
      label: Page/URL where the bug occurred
      description: "The URL where you encountered the bug (if applicable)"
      placeholder: "https://openlysts.com/discover"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Detailed steps to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happened."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: "How severe is this bug?"
      options:
        - Critical (app crash, data loss, security)
        - High (major feature broken)
        - Medium (feature partially broken)
        - Low (cosmetic, minor issue)
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: "Which browser are you using?"
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "Your OS and version"
      placeholder: "Windows 11, macOS 14, Ubuntu 22.04"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "If applicable, add screenshots to help explain the problem."
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: "Any console errors or network failures (F12 → Console/Network)."
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: "Any other context about the problem."
    validations:
      required: false
