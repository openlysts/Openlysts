name: Daily Ingestion Sync

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Ingestion Endpoint
        run: |
          curl -X POST https://openlysts.vercel.app/api/functions/runIngestion
