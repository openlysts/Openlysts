name: Ingestion Cron

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ingestion API
        run: |
          URL="${{ secrets.PRODUCTION_URL || 'https://openlysts.vercel.app' }}/api/functions/runIngestion"
          echo "Triggering ingestion at $URL"
          
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "CRON_SECRET is not configured in GitHub Secrets. Skipping cron trigger."
            exit 0
          fi
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ingestion triggered successfully (HTTP 200)."
          else
            echo "Ingestion endpoint returned HTTP Status: $HTTP_STATUS"
          fi
