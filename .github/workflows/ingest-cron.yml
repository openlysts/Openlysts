name: Git-Ops Edge Catalog Sync

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-gitops-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Edge Catalog Hydration Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node server/scripts/githubActionIngest.js
        
      - name: Commit and Push Changes (Zero-Cost Persistence)
        run: |
          git config --global user.name "Openlysts Sync Bot"
          git config --global user.email "bot@openlysts.app"
          git add server/data/*.json
          # Do not commit rate limit state across runs to avoid persistent lockout
          git reset server/data/rate_limit.json || true
          # Only commit and push if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(catalog): automated edge catalog hydration sync [skip ci]"
            git push
            echo "Edge Catalog successfully synced and pushed to repository."
          else
            echo "No new data to sync. Edge Catalog is up-to-date."
          fi
